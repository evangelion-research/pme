[project]
name = "emerald-pme"
version = "0.1.0"
description = "The package manager and build driver for Emerald"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.4.2",
    "httpx>=0.27",
    "tomlkit>=0.13",
]

[project.scripts]
pme = "pme.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pme"]

[dependency-groups]
dev = ["pytest>=8"]
